name: Verificação da API (manual)

# ADR 0032 (SUBSTITUÍDO em 24/11/2026). Este workflow NÃO tem agendamento de propósito: nenhum cron, nenhum ping periódico, nada que mantenha a API acordada.
# Motivo: as 750 horas gratuitas por mês do Render são da CONTA inteira, e outros serviços do dono (como o Vardão Central, usado no trabalho) gastam essas mesmas horas.
# Manter a API do Pelo & Ponto acordada durante o dia poderia suspender TODOS os serviços da conta no fim do mês.
# A API só acorda quando alguém abre o site (ADR 0037); a primeira abertura pode levar até ~2 minutos e o site avisa na tela.
#
# Uso: Actions > Verificação da API (manual) > Run workflow. Roda a vivacidade e o roteiro completo (ops/smoke.sh: API, banco e site) e fica vermelho se algo falhar.
# Atenção: rodar isto ACORDA a API (e o banco) por um tempo; use só quando precisar conferir uma publicação.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor-api
  cancel-in-progress: false

env:
  API_URL: https://queuecare-api-z5dh.onrender.com
  SITE_URL: https://peloeponto.vercel.app

jobs:
  acordar:
    name: API acordada (liveness)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Chamar a vivacidade (com tentativas, a API pode estar acordando)
        run: bash ops/retry.sh -n 4 -w 20 -- curl --fail --silent --show-error --location --max-time 100 --output /dev/null "$API_URL/actuator/health/liveness"

  completo:
    name: Roteiro completo (API, banco e site)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: ops/smoke.sh
        run: bash ops/retry.sh -n 3 -w 30 -- bash ops/smoke.sh "$API_URL" "$SITE_URL"
