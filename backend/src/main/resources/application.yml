spring:
  application:
    name: queuecare-api
  datasource:
    # Valores vêm de variáveis de ambiente (veja .env.example na raiz do repositório).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/queuecare}
    username: ${DB_USER:queuecare}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # O esquema do banco só muda por migration Flyway; o Hibernate apenas confere.
      ddl-auto: validate
    # Instantes (Instant) são gravados como timestamptz em UTC sem nenhuma configuração de fuso do JDBC.
    # Atenção: NÃO definir hibernate.jdbc.time_zone: ela desloca as colunas "time" (janelas de atendimento,
    # em horário LOCAL do prestador), como o teste de integração do agendamento comprovou.
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

queuecare:
  jwt:
    # Segredo HS256 em Base64, com pelo menos 32 bytes. Gere com: openssl rand -base64 32
    # SEM valor padrão: a aplicação não sobe sem JWT_SECRET (ADR 0003).
    secret: ${JWT_SECRET}
  # Limites de requisições (ADR 0003). Valores PADRÃO abaixo; ajuste por ambiente se precisar.
  # rate-limit:
  #   enabled: true                # liga/desliga SÓ o filtro por minuto (login, cadastro, horários livres)
  #   login-lockout-enabled: true  # bloqueio por tentativas de login (chave própria)
  #   login-per-minute: 20
  #   register-per-minute: 10
  #   slots-per-minute: 120
  #   login-failures-per-email-and-ip: 5
  #   login-failure-window-minutes: 15
  # Espera máxima pelo bloqueio da linha do prestador ao editar janelas/negócio (padrão 3s); estourou = 409 RESOURCE_BUSY.
  # scheduling:
  #   provider-lock-timeout: 3s
  # Tamanho máximo do corpo de qualquer requisição, em bytes (padrão 65536 = 64 KB; acima disso: 413).
  # http:
  #   max-body-bytes: 65536
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
