# Plano do Render (ADR 0013). SÓ plano gratuito: nenhum meio de pagamento. Os valores secretos são informados no painel, nunca aqui.
services:
  - type: web
    name: queuecare-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health/liveness   # vivacidade: NÃO depende do banco (Neon pode estar acordando)
    # Publica sozinho SÓ depois que os checks do GitHub passam (CI verde). Cada merge de backend roda as migrações em produção:
    # a regra de expandir e contrair (docs/operacao.md) é obrigação. Se mudar aqui, mude também no painel (Settings > Build & Deploy > Auto-Deploy).
    autoDeployTrigger: checksPass
    # Só publica quando o que vai para a imagem da API muda (o backend e este arquivo): mudar README, docs ou o frontend NÃO reinicia a API de produção (cada reinício deixa a API
    # fora do ar por ~2 min e zera o relógio do sono). Se mudar aqui, mude também no painel (Settings > Build & Deploy > Build Filters > Included Paths).
    buildFilter:
      paths:
        - backend/**
        - render.yaml
    envVars:
      - key: DEMO_ENABLED    # demonstração pública (ADR 0041): "true" liga o estúdio fictício e a entrada sem senha (valor no painel; não é segredo)
        sync: false
      - key: DB_URL          # URL do Neon COM pooler, ex.: jdbc:postgresql://HOST-pooler/DB?sslmode=require&prepareThreshold=0
        sync: false
      - key: DB_DIRECT_URL   # URL do Neon DIRETA (sem pooler), só para as migrations
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET      # Base64 de pelo menos 32 bytes; fixo (trocar invalida os tokens)
        sync: false
      - key: CORS_ALLOWED_ORIGINS   # só o endereço do site publicado, ex.: https://queuecare.pages.dev
        sync: false
