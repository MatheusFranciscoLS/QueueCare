<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">Arquitetura do Pelo &amp; Ponto (QueueCare)</title>
  <desc id="d">O navegador (React) fala com a API Spring Boot por HTTPS e JSON; a API usa o PostgreSQL. O GitHub Actions roda os testes e, com tudo verde, publica o site na Vercel e a API no Render.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="400" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- CI -->
  <rect x="40" y="24" width="840" height="54" rx="10" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="60" y="48" font-size="15" font-weight="700" fill="#0a3069">GitHub Actions (cada PR e cada merge)</text>
  <text x="60" y="68" font-size="13" fill="#1f2328">backend · frontend · navegador (Playwright) · imagem Docker com AppCDS · restauração de backup · Gitleaks · npm audit</text>

  <!-- publica -->
  <line x1="150" y1="78" x2="150" y2="156" stroke="#57606a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <line x1="460" y1="78" x2="460" y2="156" stroke="#57606a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#seta)"/>
  <text x="160" y="124" font-size="12" fill="#57606a">publica com o CI verde</text>
  <text x="470" y="124" font-size="12" fill="#57606a">publica com o CI verde</text>

  <!-- Navegador -->
  <rect x="40" y="160" width="220" height="120" rx="12" fill="#f6f8fa" stroke="#57606a"/>
  <text x="60" y="188" font-size="16" font-weight="700" fill="#1f2328">Navegador</text>
  <text x="60" y="212" font-size="13" fill="#1f2328">React 19 · TypeScript · Vite</text>
  <text x="60" y="232" font-size="12" fill="#57606a">app instalável (PWA)</text>
  <text x="60" y="250" font-size="12" fill="#57606a">token JWT só em memória</text>
  <text x="60" y="268" font-size="12" fill="#57606a">hospedado na Vercel</text>

  <!-- API -->
  <rect x="350" y="160" width="260" height="120" rx="12" fill="#f6f8fa" stroke="#57606a"/>
  <text x="370" y="188" font-size="16" font-weight="700" fill="#1f2328">API · Spring Boot 4 · Java 21</text>
  <rect x="368" y="200" width="104" height="26" rx="6" fill="#ffffff" stroke="#afb8c1"/><text x="420" y="218" font-size="12" text-anchor="middle" fill="#1f2328">web (REST)</text>
  <rect x="480" y="200" width="112" height="26" rx="6" fill="#ffffff" stroke="#afb8c1"/><text x="536" y="218" font-size="12" text-anchor="middle" fill="#1f2328">application</text>
  <rect x="368" y="234" width="104" height="26" rx="6" fill="#ffffff" stroke="#afb8c1"/><text x="420" y="252" font-size="12" text-anchor="middle" fill="#1f2328">persistence</text>
  <rect x="480" y="234" width="112" height="26" rx="6" fill="#ffffff" stroke="#afb8c1"/><text x="536" y="252" font-size="12" text-anchor="middle" fill="#1f2328">security (JWT)</text>
  <text x="370" y="274" font-size="11" fill="#57606a">hospedada no Render (plano gratuito)</text>

  <!-- Banco -->
  <rect x="700" y="160" width="180" height="120" rx="12" fill="#f6f8fa" stroke="#57606a"/>
  <text x="720" y="188" font-size="16" font-weight="700" fill="#1f2328">PostgreSQL 16</text>
  <text x="720" y="212" font-size="12" fill="#1f2328">reserva sem sobreposição</text>
  <text x="720" y="230" font-size="12" fill="#57606a">(restrição de exclusão)</text>
  <text x="720" y="250" font-size="12" fill="#57606a">auditoria só de acréscimo</text>
  <text x="720" y="268" font-size="12" fill="#57606a">hospedado no Neon</text>

  <!-- Setas de dados -->
  <line x1="262" y1="220" x2="348" y2="220" stroke="#57606a" stroke-width="2" marker-end="url(#seta)" marker-start="url(#seta)"/>
  <text x="305" y="210" font-size="11" text-anchor="middle" fill="#57606a">HTTPS · JSON</text>
  <line x1="612" y1="220" x2="698" y2="220" stroke="#57606a" stroke-width="2" marker-end="url(#seta)" marker-start="url(#seta)"/>
  <text x="655" y="210" font-size="11" text-anchor="middle" fill="#57606a">JPA · Flyway</text>

  <!-- Regras -->
  <rect x="40" y="304" width="840" height="76" rx="10" fill="#fff8c5" stroke="#d4a72c"/>
  <text x="60" y="328" font-size="14" font-weight="700" fill="#3b2300">Onde cada garantia mora</text>
  <text x="60" y="350" font-size="12.5" fill="#1f2328">Sem reserva dupla: no banco (testado com pedidos simultâneos) · Quem pode chamar o quê: na API (matriz perfil × rota no CI)</text>
  <text x="60" y="368" font-size="12.5" fill="#1f2328">Contrato OpenAPI gerado do código e conferido por teste · Migrações no padrão expandir e contrair, porque o Render publica sozinho</text>
</svg>
