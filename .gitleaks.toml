# Configuração do Gitleaks (job "Segredos" do CI).
# Mantém TODAS as regras padrão e libera somente valores EXATOS de teste, e SÓ dentro de arquivos de teste
# (caminho E valor precisam coincidir). Não há exceção por diretório inteiro nem por padrão amplo.
title = "QueueCare"

[extend]
useDefault = true

[[allowlists]]
description = "Segredo JWT exclusivo de teste (nunca vale fora dos testes)"
condition = "AND"
paths = ['''backend/src/test/.*''']
regexes = ['''dGVzdGUtZXhjbHVzaXZvLWRlLXRlc3RlLTMyLWJ5dGVzLSEh''']

[[allowlists]]
description = "Senha fictícia usada nos testes de autenticação"
condition = "AND"
paths = ['''backend/src/test/.*''']
regexes = ['''senha-forte-123''']
