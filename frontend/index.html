<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pelo &amp; Ponto</title>
    <meta name="description" content="Agende banho e tosa, acompanhe a fila e organize o dia do estúdio." />
    <!-- App instalável (ADR 0030): manifesto, cor da barra do sistema (clara e escura) e ícones. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#115e7a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1a19" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pelo & Ponto" />
    <script>
      // Tema salvo aplicado ANTES da primeira renderização (sem piscar claro antes do escuro). Sem armazenamento, segue o sistema.
      try {
        var t = localStorage.getItem('pp-tema')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
