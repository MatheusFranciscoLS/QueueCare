spring:
  application:
    name: queuecare-api
  datasource:
    # Valores vêm de variáveis de ambiente (veja .env.example na raiz do repositório).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/queuecare}
    username: ${DB_USER:queuecare}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # O esquema do banco só muda por migration Flyway; o Hibernate apenas confere.
      ddl-auto: validate
    properties:
      # Horários guardados como instantes UTC (timestamptz).
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
