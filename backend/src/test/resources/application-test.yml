# Perfil usado só no teste de arranque (sem Docker e sem PostgreSQL).
# H2 não substitui o PostgreSQL: constraints, concorrência e transações são testados com PostgreSQL real.
spring:
  datasource:
    url: jdbc:h2:mem:queuecare;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
  flyway:
    enabled: false

queuecare:
  jwt:
    # Segredo EXCLUSIVO de teste (32 bytes em Base64). Nunca usar fora dos testes.
    secret: dGVzdGUtZXhjbHVzaXZvLWRlLXRlc3RlLTMyLWJ5dGVzLSEh
  security:
    bcrypt-strength: 4
